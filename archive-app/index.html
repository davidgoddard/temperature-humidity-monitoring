<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sensor archive</title>
<style>
:root{font:16px system-ui,sans-serif;color:#203042;background:#f4f7fb}*{box-sizing:border-box}body{max-width:1250px;margin:auto;padding:32px 24px}h1{margin:0;font-size:30px}p{color:#596a7f}.top,.filters{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}section{background:white;border:1px solid #dce5ef;border-radius:16px;padding:24px;margin-top:24px}label{display:flex;flex-direction:column;gap:7px;font-size:14px}input,select,button{font:inherit;border:1px solid #cad6e4;border-radius:8px;padding:10px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#1758b4;color:white;border-color:#1758b4}.filters{justify-content:flex-start;align-items:end}canvas{width:100%;height:420px;display:block}#legend{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0}.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.stats{display:flex;gap:40px;margin-top:20px}.stats strong{display:block;font-size:25px}#status{min-height:24px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e3e9f1}.table-wrap{overflow:auto}small{color:#596a7f}@media(max-width:600px){body{padding:20px 12px}section{padding:16px}.stats{gap:18px}canvas{height:320px}input{max-width:100%}}
</style></head><body>
<div class="top"><div><h1>Sensor archive</h1><p>Temperature and humidity, week after week.</p></div><button id="reload" class="primary">Reload archive files</button></div>
<p id="status" role="status" aria-live="polite">Loading archives…</p>
<section><div class="filters"><label>From (local time)<input id="from" type="datetime-local" step="1"></label><label>To (local time)<input id="to" type="datetime-local" step="1"></label><label>Measurement<select id="metric"><option value="4">Temperature (°C)</option><option value="5">Humidity (%)</option></select></label><label>Sensor<select id="sensor"><option value="">All sensors</option></select></label><label>Dataset<select id="dataset"><option value="">All datasets</option></select></label><button id="all">All dates</button><button id="export">Export selected CSV</button></div><div class="stats"><div><strong id="count">0</strong><small>Readings in range</small></div><div><strong id="files">0</strong><small>Archive files loaded</small></div><div><strong id="sensors">0</strong><small>Sensors in range</small></div></div></section>
<section><canvas id="chart" role="img" aria-label="Archived sensor readings over time"></canvas><div id="legend"></div><small id="coverage"></small></section>
<section><h2>Readings in this period</h2><p id="tableInfo"></p><div class="table-wrap"><table><thead><tr><th>Measurement time</th><th>Sensor</th><th>Temperature</th><th>Humidity</th><th>Dataset</th></tr></thead><tbody id="readings"></tbody></table></div></section>
<script src="/viewer.js"></script></body></html>
